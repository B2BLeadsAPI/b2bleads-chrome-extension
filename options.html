<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>B2BLeads — Settings</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body class="options-page">
  <div class="header">
    <img src="icons/icon48.png" alt="" />
    <h1>B2BLeads</h1>
  </div>
  <p class="muted">
    Paste an API key from your
    <a href="https://b2bleadsapi.com/app/api-keys" target="_blank" rel="noopener">B2BLeads dashboard</a>
    to enable lead search from the toolbar.
  </p>
  <label for="api-key">API key</label>
  <input id="api-key" type="password" placeholder="blk_..." autocomplete="off" />
  <button id="save">Save</button>
  <p id="status" class="status"></p>
  <script src="options.js"></script>
</body>
</html>
